scoring_instructions: |
  Follow these steps IN ORDER for each job. Do not skip steps or freelance.
  
  ## Step 1: DISQUALIFY CHECK (check top-to-bottom, FIRST match → assign score and STOP)
  - Specialized domain candidate cannot do (CA, nurse, lawyer, licensed engineer) → score 1
  - Title indicates extreme seniority (VP, Director, Principal, Fellow, Chief, Head of, Sr. Manager, Staff Engineer) or requires PhD → score 1
  - Targets a graduation batch after 2022 (e.g. "2023 batch only", "2025 graduates only") → score 1
  - Pure clerical/back-office downgrade with no tech or analytical component (e.g. data entry,
    call center agent, collections, KYC/AML, claims processing) → score 1
    EXEMPTION to THIS rule only: support/ops roles at or above Amazon SPS Associate level
    (same or similar seniority/scope/responsibilities) are NOT a downgrade, even if non-technical.
  - Requires 3+ years in any field → score 1

  ## Step 2: EXTRACT EXPERIENCE REQUIREMENT
  Find the exact years of experience the job posting states.
  If none mentioned anywhere in the posting → treat as 0 years.

  ## Step 3: CLASSIFY ROLE TYPE (pick the FIRST match)
  A. SDE / SWE / Software Engineer / Backend / Full-Stack / Engineer (software) / QA / SDET / Test Engineer
  C. Support (Tech Support, Customer Support, SaaS Support, Seller Support, Account Support)
  D. Operations / Data Analyst / Associate / Sales Ops
  E. Any other role

  ## Step 4: LOOK UP BASE SCORE

  Experience →    0-1 yrs     2 yrs
  ─────────────────────────────────
  A (SDE/QA)      9           6
  C (Support)     9           7
  D (Ops)         9           5
  E (Other)       7           5

  (If the JD states a single number, use it directly. If it states a range, use the MINIMUM
  of that range to pick the bucket. Examples: "0-2 years" → min is 0 → falls in "0-1" bucket.
  "1-2 years" → min is 1 → falls in "0-1" bucket. "2-3 years" → min is 2 → falls in "2" bucket.
  "3-5 years" → min is 3 → already disqualified in Step 1, never reaches this table.)

  ## Step 5: ADJUSTMENTS (apply only these, max -1 each)
  - Location: not Bangalore and not Remote → subtract 1
  - Skill mismatch: job's required tech stack has no overlap with candidate's skills → subtract 1

  No other adjustments allowed. Do not invent penalties.

  ## Response Format
  In your reason, state: (1) the experience requirement you found (or "no experience mentioned"),
  (2) the role type you picked (A/C/D/E), (3) any adjustments applied.
  Return the final score (1-10) and a 1-sentence summary.

genai:
  login_url: "xxxx"
  validate_url: "xxxx"
  chat_url: "xxxx"
  username: "xxxx"              # Env var reference
  password: "xxxx"              # Env var reference (base64-encoded)
  model: "claude-opus-4-6"
  application_name: "job-posting-watcher"
  # Public Anthropic rates for claude-opus-4-6 (not Visa's actual contracted rate,
  # which may differ — update if you get the real negotiated numbers).
  # cache_write assumes the default 5-minute cache TTL (1-hour TTL is $10/M instead).
  pricing:
    input_per_million: 5.0
    output_per_million: 25.0
    cache_write_per_million: 6.25
    cache_read_per_million: 0.50
  match_threshold: 3                         # 1-10 score, only notify if >= this

email:
  sender_email: "xxxx"
  recipient_email: "xxxx"
  digest_mode: "aggregated"  # "per_company" = one email per site, "aggregated" = single email after all sites
  aggregated_threshold: 10   # in aggregated mode, flush email when matches reach this count (0 = send only at end)

resume_builder:
  threshold: 7                       # generate resumes for jobs scoring > this
  base_resume: "data/resume_v5"
  exp_additional_bullets: "config/exp_additional_bullets.yaml"  # extra Amazon bullets the tailoring LLM can pick from
  attach_resume: true               # when true, generate + attach PDFs before sending email
  enabled_scrapers:                  # only generate/attach resumes for jobs from these scraper types
    - workday
    - successfactors
    - google
    - goldmansachs
    - greenhouse
    - lever
    - ashby
  tex_bin: "/Library/TeX/texbin"     # path to TeX binaries (pdflatex), added to PATH if set

schedule:
  interval_minutes: 60
  delay_between_sites_seconds: 5

# Skip job postings older than this many days. Shared across all scrapers.
max_age_days: 10

# Auto-apply settings (used by apply.py)
apply:
  auto_apply: true                   # true = auto-apply after each scrape cycle in main.py
  headless: false                    # true = invisible browser, false = visible (default)
  test_mode: false                    # true = stop before final submit (dry run)
  apply_threshold: 7                 # only auto-apply to jobs >= this score
  answer_confidence_threshold: 7     # LLM confidence floor (1-10); below = skip job
  delay_between_jobs_seconds: 10     # polite delay between applications
  resume_email: "xxxx"  # email on the original resume; if different from personal.email, resume is recompiled with the apply email
  blacklist_companies:               # skip auto-apply for these companies (case-insensitive)
    - "visa"
  skip_no_credentials: false          # skip jobs for portals without saved credentials (no manual sign-in prompt)
#  blacklist_companies:               # skip auto-apply for these companies (case-insensitive)
#    - "visa"
  skip_roles:                          # LLM-based role filter (batched before applying)
    - role: "Resolution Coordinator"
      company: "Walmart"
      reason: "too low salary"
      instructions: "Only skip entry-level 'Resolution Coordinator'. Do NOT skip Sr. Resolution Coordinator, Senior Resolution Coordinator, Lead Resolution Coordinator — those are valid higher-paying roles."
  regenerate_resumes: false             # regenerate resumes before applying (overwrites existing)
  resume_freshness_days: 1             # skip regeneration if resume was generated within this many days
  skills_min: 8                      # minimum skills to fill (keep retrying until this)
  skills_max: 20                     # ask LLM for this many candidates per round
  skills_retry_count: 3              # max LLM back-and-forth attempts for alternatives

# Workday per-portal location facets are in config/workday_locations.yaml
# (generated by: python scripts/discover_locations.py)

# City filters for the job-board scrapers that support them.
greenhouse:
  cities:
    - Bengaluru
    - Bangalore
    - Hyderabad

lever:
  cities:
    - Bengaluru
    - Bangalore
    - Hyderabad

ashby:
  cities:
    - Bengaluru
    - Bangalore
    - Hyderabad
